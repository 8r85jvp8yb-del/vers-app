  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const B = 0.5; // 120 BPM: one beat = 15 frames
      const beat = (n) => Math.round(n * B * 30) / 30;
      const slam = (sel, at) => tl.fromTo(sel, { scale: 1.22, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "expo.out", transformOrigin: "0% 50%" }, at);
      const panels = ["#b1-p0", "#b1-p1", "#b1-p2", "#b1-p3", "#b1-p4", "#b1-p5", "#b1-p6", "#b1-p7"];
      // panel n starts on beat: opener 3 beats, each word 4 beats
      const starts = [0, beat(3), beat(7), beat(11), beat(15), beat(19), beat(23), beat(27)];
      starts.forEach((t, i) => {
        if (i === 0) return;
        tl.set(panels[i], { opacity: 1 }, t);
        tl.set(panels[i - 1], { opacity: 0 }, t);
      });

      // opener: "desken." punches once on the downbeat
      tl.fromTo("#b1-open", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "expo.out", transformOrigin: "0% 50%" }, 0);

      const card = (sel, at) => tl.fromTo(sel, { y: 420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, at);
      const head = (n, t) => { slam(`#b1-p${n} .b1-word`, t); tl.fromTo(`#b1-p${n} .b1-sub`, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t + 0.12); };
      let t = starts[1]; head(1, t); card("#b1-c1", t + beat(1) - 0.2);
      tl.to("#b1-c1 img", { y: -160, duration: 1.2, ease: "power1.inOut" }, t + beat(2));
      t = starts[2]; head(2, t); card("#b1-c2", t + 0.2);
      tl.to("#b1-ringc", { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, t + beat(1) + 0.1);
      t = starts[3]; head(3, t); card("#b1-c3", t + 0.2);
      tl.fromTo("#b1-c3b", { x: -1100 }, { x: 0, duration: 0.32, ease: "expo.out" }, t + beat(1) + 0.1);
      t = starts[4]; head(4, t); card("#b1-c4", t + beat(1) - 0.2);
      t = starts[5]; head(5, t);
      tl.fromTo("#b1-send", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, t + beat(1) - 0.1);
      tl.to("#b1-send", { scale: 0.9, duration: 0.07, ease: "power2.in" }, t + beat(2));
      tl.to("#b1-send", { scale: 1, duration: 0.2, ease: "expo.out" }, t + beat(2) + 0.07);
      tl.to("#b1-plane", { x: 900, y: -700, rotation: -12, duration: 0.45, ease: "power3.in" }, t + beat(2) + 0.05);
      t = starts[6]; head(6, t); card("#b1-c6", t + beat(1) - 0.2);

      // 7 pocket: the phone rises, the switches flip on the beat
      t = starts[7];
      tl.fromTo("#b1-phone", { y: 1400 }, { y: 0, duration: 0.6, ease: "expo.out" }, t);
      tl.fromTo("#b1-title", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, t + 0.15);
      tl.to("#b1-phone", { y: -560, scale: 1.25, transformOrigin: "360px 1050px", duration: 0.7, ease: "power2.inOut" }, t + beat(2));
      tl.to("#b1-title", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, t + beat(4));
      tl.fromTo("#b1-title2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, t + beat(4) + 0.12);

      window.__timelines["b1"] = tl;
    })();
  </script>
